<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Marketing Sandbox</title>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NLN3L7RM"></script>
    <style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 { color: #1a365d; font-size: 24px; margin-bottom: 8px; }
    p { color: #4a5568; font-size: 14px; margin-bottom: 24px; }
    button, input[type="submit"] {
        background-color: #2b6cb0;
        color: white;
        border: none;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
    }
    button:hover { background-color: #2c5282; }
    form {
        background: #f7fafc;
        border: 1px solid #e2e8f0 !important;
        border-radius: 8px;
        padding: 20px;
        margin-top: 24px;
    }
    input[type="email"] {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 16px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        box-sizing: border-box;
    }
</style>

</head>

<body>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
    <h1>My Analytics Practice Site</h1>
    <p>Welcome to my testing sandbox.</p>

    <!-- Button for click tracking practice -->
    <button id="download-resume-btn" style="padding: 10px 20px; font-size: 16px;">Download Resume</button>

    <br><br>

    <!-- Form for form submission practice -->
    <form id="contact-form" action="#" method="POST" onsubmit="return false;" style="border: 1px solid #ccc; padding: 20px; max-width: 300px;">
        <h3>Contact Me</h3>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <button type="submit" onclick="window.datalayer.push({
            'event': 'contact_form',
            'form_metadata': {
                'form_id': 'contact_form',
                'form_category': 'contact_page',
                'user_tier': 'premium_lead'
            }
        });">Submit Form</button>
    </form>
</body>
</html>
